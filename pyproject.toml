[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-workflow-kit"
version = "0.1.0"
description = "Local cross-agent history, commit-bound verification, and durable worker coordination"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
awk-kit = "agent_workflow_kit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
